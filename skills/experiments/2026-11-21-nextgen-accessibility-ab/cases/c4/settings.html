<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading settings | Ashby Libraries e-books</title>
<style>
  body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.55; max-width: 44rem; margin: 0 auto; padding: 1rem; }
  a { color: #0b4f8a; }
  :focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
  fieldset { border: 1px solid #4a4a4a; margin: 0 0 1rem; padding: .5rem 1rem; }
  label { display: block; margin: .3rem 0; }
  button { font: inherit; padding: .45rem .9rem; border: 2px solid #1a1a1a; background: #fff; color: #1a1a1a; }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<header><p><a href="/">Ashby Libraries e-books</a> · Signed in as reader 20481193</p></header>
<main>
<h1>Reading settings</h1>
<p>Choose how books look and sound. Your settings are saved to your library account and follow you to any device.</p>

<form id="prefs">
  <fieldset><legend>Text size</legend>
    <label><input type="radio" name="size" value="100" checked> Standard</label>
    <label><input type="radio" name="size" value="150"> Large</label>
    <label><input type="radio" name="size" value="200"> Extra large</label>
  </fieldset>
  <fieldset><legend>Contrast</legend>
    <label><input type="radio" name="contrast" value="normal" checked> Standard</label>
    <label><input type="radio" name="contrast" value="high"> High contrast</label>
  </fieldset>
  <fieldset><legend>Motion</legend>
    <label><input type="checkbox" name="motion" value="reduce"> Reduce animation</label>
  </fieldset>
  <fieldset><legend>Font</legend>
    <label><input type="radio" name="font" value="default" checked> Default</label>
    <label><input type="radio" name="font" value="dyslexia"> Dyslexia-friendly font</label>
  </fieldset>
  <fieldset><legend>Line spacing</legend>
    <label><input type="radio" name="spacing" value="1.5" checked> Standard</label>
    <label><input type="radio" name="spacing" value="2"> Wide</label>
  </fieldset>
  <fieldset><legend>Reading level</legend>
    <label><input type="radio" name="level" value="original" checked> Original text</label>
    <label><input type="radio" name="level" value="simplified"> Simplified text (rewritten for easier reading)</label>
  </fieldset>
  <fieldset><legend>Screen reader mode</legend>
    <label><input type="checkbox" name="sr" value="1"> I use a screen reader</label>
  </fieldset>
  <button type="submit">Save settings</button>
  <p id="status" role="status"></p>
</form>
</main>
<footer><p><a href="/accessibility">Accessibility</a> · <a href="/privacy">Privacy</a></p></footer>
<script>
  document.getElementById('prefs').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    await fetch('/api/account/reading-prefs', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    document.cookie = 'rp=' + encodeURIComponent(JSON.stringify(data)) + '; path=/; max-age=31536000; SameSite=Lax';
    document.getElementById('status').textContent = 'Settings saved.';
  });
</script>
</body>
</html>
